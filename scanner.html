<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a0d3d">
<title>Scanner</title>
<style>
:root{color-scheme:dark;--text:#f6f2ff;--text2:#c9bdea;--muted:#9a8cc4;--ok:#86efac;--ko:#ff9a8f;--warn:#fcd34d}
*{box-sizing:border-box}
html{background:#1a0d3d;min-height:100%}
body{margin:0;color:var(--text);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:16px;display:grid;place-items:start center}
.wrap{width:min(440px,100%)}
h1{font-size:22px;font-weight:500;margin:4px 0 12px}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#0a041e;aspect-ratio:1;border:1px solid rgba(255,255,255,.13)}
video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:18%;border:2px solid rgba(255,255,255,.7);border-radius:16px;pointer-events:none}
.verdict{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:18px;white-space:pre-line}
.verdict.show{display:flex}
.verdict b{font-size:34px;font-weight:600;margin-bottom:6px}
.verdict.ok{background:rgba(22,101,52,.94);color:#dcfce7}
.verdict.warn{background:rgba(133,77,14,.95);color:#fef3c7}
.verdict.ko{background:rgba(153,27,27,.95);color:#fee2e2}
.msg{margin:12px 0;color:var(--text2);font-size:14px;min-height:21px}
form{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(10,4,30,.55);color:var(--text);font:500 16px ui-monospace,Consolas,monospace;text-transform:uppercase;letter-spacing:.08em}
.btn{padding:12px 16px;border:0;border-radius:10px;background:#7c3aed;color:#fff;font:500 16px system-ui,sans-serif;cursor:pointer}
input:focus-visible,.btn:focus-visible{outline:2px solid #c4b5fd;outline-offset:2px}
.log{margin:20px 0 0;padding:0;list-style:none;font-size:14px}
.log li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,.1);color:var(--text2)}
.log .t{color:var(--muted)}
.s-ok{color:var(--ok)}.s-warn{color:var(--warn)}.s-ko{color:var(--ko)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Contrôle des pass</h1>
  <div class="cam"><video id="v" playsinline muted></video><div class="frame"></div><div class="verdict" id="vd" role="status" aria-live="assertive"></div></div>
  <div class="msg" id="msg">Démarrage de la caméra</div>
  <form id="f"><input id="k" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="Ou taper le code : V26110001"><button class="btn" type="submit">Vérifier</button></form>
  <ul class="log" id="log" aria-label="Derniers passages"></ul>
</div>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const clean = v => String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
/* Un QR contient l'adresse pass.html?c=CODE ; on accepte aussi un code seul. */
function codeFrom(txt) {
  try { const c = new URL(txt).searchParams.get("c"); if (c) return clean(c); } catch (_) {}
  const k = clean(txt); return /^[IV]\d{8}$/.test(k) ? k : "";
}
let busy = false, last = "", lastAt = 0, hideT;
function verdict(cls, title, sub) {
  const d = $("vd"); d.className = "verdict show " + cls;
  d.innerHTML = `<b>${esc(title)}</b>${sub ? esc(sub) : ""}`;
  clearTimeout(hideT); hideT = setTimeout(() => { d.className = "verdict"; busy = false; }, 3000);
}
function logLine(cls, label, who) {
  const li = document.createElement("li");
  li.innerHTML = `<span class="s-${cls}">${esc(label)}</span><span>${esc(who)} <span class="t">${new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}</span></span>`;
  $("log").prepend(li);
  while ($("log").children.length > 8) $("log").lastChild.remove();
}
async function check(code) {
  if (!code || busy) return;
  busy = true; last = code; lastAt = Date.now();
  try {
    const d = await rpc("pass_status", { p_code: code });
    const role = d.role === "intervenant" ? "Intervenant" : "Visiteur";
    if (d.state === "valid") { verdict("ok", "Valide", role + " · " + d.name); logLine("ok", "Valide", d.name); }
    else if (d.state === "expired") { verdict("warn", "Périmé", role + " · " + d.name + "\nPérimé depuis le " + new Date(d.expires).toLocaleDateString("fr-FR")); logLine("warn", "Périmé", d.name); }
    else { verdict("ko", "Inconnu", "Ce code ne correspond à aucun pass"); logLine("ko", "Inconnu", code); }
  } catch (_) { verdict("ko", "Connexion impossible", "Réessaie"); }
}
$("f").onsubmit = e => {
  e.preventDefault(); const k = codeFrom($("k").value); $("k").value = "";
  if (k) check(k); else verdict("ko", "Code invalide", "Format attendu : V26110001");
};

async function start() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $("msg").textContent = "Caméra indisponible ici : tape le code."; return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false }); }
  catch (_) { $("msg").textContent = "Caméra refusée : autorise-la dans le navigateur, ou tape le code."; return; }
  const v = $("v"); v.srcObject = stream; await v.play().catch(() => {});
  $("msg").textContent = "Présente le QR code devant la caméra";
  const det = window.BarcodeDetector ? new BarcodeDetector({ formats: ["qr_code"] }) : null;
  const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
  const tick = async () => {
    if (!busy && v.videoWidth) {
      let txt = "";
      try {
        if (det) { const r = await det.detect(v); if (r[0]) txt = r[0].rawValue; }
        else if (window.jsQR) {
          const w = 480, h = Math.round(w * v.videoHeight / v.videoWidth);
          cv.width = w; cv.height = h; cx.drawImage(v, 0, 0, w, h);
          const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h); if (r) txt = r.data;
        }
      } catch (_) {}
      const c = codeFrom(txt);
      if (c && !(c === last && Date.now() - lastAt < 4000)) check(c);
    }
    setTimeout(tick, 250);
  };
  tick();
}
start();
</script>
</body>
</html>
